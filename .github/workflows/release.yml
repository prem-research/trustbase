name: Trustbase measurements and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trustbase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          bash .github/scripts/install-gh.sh
      - name: Validate authoring inputs and run offline tests
        run: make validate test
      - name: Compare with pinned Kata code
        run: make conformance
      - name: Verify published PodVM integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: make integration
      - name: Select version and enforce publication inputs
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python .github/scripts/release.py version
          if [[ -n "$RELEASE_TAG" ]]; then
            python trustbase.py validate --require-workloads
          fi
      - name: Freeze verified PodVM inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python trustbase.py resolve --output build/inputs
      - name: Package release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python trustbase.py package \
            --inputs build/inputs --output dist \
            --release-version "$VERSION" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-revision "$GITHUB_SHA"
          python trustbase.py verify --dist dist
      - name: Upload reviewable assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trustbase-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          bash .github/scripts/install-gh.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: trustbase-release-assets
          path: dist
      - name: Verify candidate and reject existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python trustbase.py verify --dist dist --require-workloads
          python .github/scripts/release.py check
      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/measurements.json
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Verify attestations and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release.py publish
